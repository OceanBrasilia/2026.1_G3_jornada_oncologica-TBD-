name: Validar projeto
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Verificar estrutura e arquivos proibidos
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$REPO_NAME" = "project-template" ]; then
            python .github/scripts/validate_project.py --template
          else
            python .github/scripts/validate_project.py
          fi
